InstanceType=OneSix
name=RDC Season 2
iconKey=default
notes=Mods sync automatically every time you press Play. Do not add or remove mods by hand.

# --- packwiz auto-update -------------------------------------------------
# OverrideCommands MUST be true or Prism ignores PreLaunchCommand entirely.
OverrideCommands=true

# Absolute paths are required. Prism runs pre-launch commands in the LAUNCHER's
# working folder, not the instance folder, and packwiz-installer's --pack-folder
# defaults to "." (the CWD). Without --pack-folder the mods land in the Prism
# install directory and the instance silently stays on the old pack.
#
# No -g flag on purpose: the cast SHOULD see the progress window, otherwise a
# slow sync looks like a frozen launcher and they force-quit mid-download.
PreLaunchCommand="$INST_JAVA" -jar "$INST_MC_DIR/packwiz-installer-bootstrap.jar" --pack-folder "$INST_MC_DIR" --multimc-folder "$INST_DIR" --title "RDC Season 2 - syncing mods" __PACK_URL__

# --- memory --------------------------------------------------------------
# Recording + streaming on top of a modded client. 6G heap, explicit so nobody
# ends up on the 1G default and blames the pack for stuttering.
OverrideMemory=true
MinMemAlloc=2048
MaxMemAlloc=6144

OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
